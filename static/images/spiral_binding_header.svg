    <path d="M 17 30 C 14 12, 16 2, 23 2 C 30 2, 32 12, 29 30 C 28 34, 24 34, 23 30" 
          fill="none" stroke="url(#wireGrad)" stroke-width="4.5" stroke-linecap="round" filter="url(#wireShadow)"/>
