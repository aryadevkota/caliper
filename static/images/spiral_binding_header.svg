<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 48" fill="none" preserveAspectRatio="none">
  <defs>
    <!-- Wire metallic cylinder gradient -->
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C827A"/>
      <stop offset="25%" stop-color="#D5CBBF"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#A3988E"/>
      <stop offset="100%" stop-color="#5E554D"/>
    </linearGradient>
    
    <!-- Wire drop shadow -->
    <filter id="wireShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#3D1E28" flood-opacity="0.22"/>
    </filter>

    <!-- Punch hole shadow -->
    <linearGradient id="holeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D1E28" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#8A7D70" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D5CBBF" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

